    <div class="mainGrid">
        <div class="mapHighlight">
            <div id="map">
                <script>
                    const heightPix = 1164;
                    const widthPix = 1892;

                    const map = L.map('map', {
                        crs: L.CRS.Simple,
                        minZoom: -.5,
                        maxZoom: 4
                    });
                    const bounds = [[0, 0], [heightPix, widthPix]];

                    const mOverlay = L.imageOverlay('TrailMaps/Screenshot 2025-11-25 211953.png', bounds, {
                        attribution: '&copy; <a href="https://jaypeakresort.com/">JayPeakResort</a>'
                    }).addTo(map);

                    map.fitBounds(bounds);
                    map.setMaxBounds(bounds);
                    map.setView([heightPix / 2 + 100, widthPix / 2 + 100], 0);

                    let closed = false;

                    if (closed) {
                        L.rectangle(bounds, {color: "#FFFFFF", weight: 1}).addTo(map);
                        const marker = L.marker([bounds[1][0] / 2, bounds[1][1] / 2]).addTo(map);
                        marker.bindTooltip("Mountain Closed").openTooltip();
                    }
                </script>
            </div>

        <div class="weather">
            <div class="curWeather">
                <div id="weatherImg">
                    <img src="Icons/10010_cloudy_large@2x.png" alt="Weather Icon"/>
                </div>
                <p id="temp">20°F</p>
                <p id="tempApparent">Feels Like: 12°F</p>
            </div>
            <div class="snowForecast">
                <p id="windSpeed">Wind Speed: </p>
                <p id="expectedSnow">Snow or Rain: </p>
            </div>

            <script>
                celsiusToFahrenheit = (celsius) => (celsius * 9/5) + 32;

                weatherRead().done(function(read) {
                    weatherList = convertToWeather(read);
                    const jayWeather = weatherList[1];
                    const temp = jayWeather.getTemp();
                    const tempA = jayWeather.getFeelsLike();
                    const windS = jayWeather.getWindSpeed();
                    const conditions = jayWeather.getConditions();
                    console.log(conditions);
                    const weatherCode = jayWeather.getWeatherCode();

                    const iconMap = {
                        1000: "10000_clear_large@2x.png",
                        1001: "10010_cloudy_large@2x.png",
                        1100: "11000_mostly_clear_large@2x.png",
                        1101: "11001_mostly_clear_large@2x.png",
                        1102: "11020_mostly_cloudy_large@2x.png",
                        2000: "20000_fog_large@2x.png",
                        2100: "21000_fog_light_large@2x.png",
                        4000: "40000_drizzle_large@2x.png",
                        4001: "40010_rain_large@2x.png",
                        4200: "42000_rain_light_large@2x.png",
                        4201: "42010_rain_heavy_large@2x.png",
                        5000: "50000_snow_large@2x.png",
                        5001: "50010_flurries_large@2x.png",
                        5100: "51000_snow_light_large@2x.png",
                        5101: "51010_snow_heavy_large@2x.png",
                        6000: "60000_freezing_rain_drizzle_large.png",
                        6001: "60010_freezing_rain_large@2x.png",
                        6200: "62000_freezing_rain_light_large@2x.png"
                    };

                    let iconFileName = iconMap[weatherCode] || "unknown.png";
                    let icon = "Icons/" + iconFileName;

                    let img = document.getElementById("weatherImg").getElementsByTagName("img")[0];
                    img.src = icon;

                    const t = document.getElementById("temp");
                    t.innerHTML = temp + "°F";

                    const ta = document.getElementById("tempApparent");
                    ta.innerHTML = "Feels Like: " + tempA + " °F";

                    const wSpeed = document.getElementById("windSpeed");
                    wSpeed.innerHTML = "Wind Speed: " + windS + " mph";

                    const sr = document.getElementById("expectedSnow");
                    sr.innerHTML = "Snow or Rain: " + conditions;
                });
            </script>

            <div class="reviewSection">
                <p id="leaveReview">Leave a Review </p>
                <form method="POST" action="append.php">
                    Name: <input type="text" name="fname" required minlength="2" maxlength="10" pattern="[A-Za-z]+" placeholder="Enter username">
                    <br></br>
                    <p>Score: <input id="input" name="score" type="range" min="0.0" max="5.0" step="0.1" value="1"> Rating: <output id="value"></output></p>

                    <script>
                        const value = document.querySelector("#value");
                        const input = document.querySelector("#input");
                        value.textContent = input.value;
                        input.addEventListener("input", (event) => {
                            value.textContent = event.target.value;
                        });
                    </script>

                    <input type="hidden" name="mnt" value="JayPeak">
                    <label for="Trail">Choose the trail</label>
                    <select name="Trail" id="Trail"></select>

                    <script>
                        let trailsPath = 'ReadCsvData.php?action=trail&filename=jayPeakTrails.csv'
                        fetchTrails(trailsPath).then((trails) => {
                            let jay = new Mountain("Jay Peak", trails);
                            let trailNames = jay.getAllTrailNames();
                            const select = document.getElementById("Trail");
                            trailNames.forEach(trail => {
                                const option = document.createElement("option");
                                option.textContent = trail;
                                select.appendChild(option);
                            });
                        });
                    </script>

                    <input type="button" value="Submit" onclick="this.form.submit()">
                </form>
            </div>

            <div id="reviewSection">
                <ul>
                      
                </ul>
            <script>
                let reviewsPath = 'ReadCsvData.php?action=review&filename=JayPeakreview.csv';
                fetchTrails(trailsPath).then((trails) => {
                    fetchReviews(reviewsPath).then((reviews) => {
                        console.log("test");
                        let jayReviews = new MountainReviews("Jay Peak", reviews);
                        let reviewList = jayReviews.getListOfReviews();
                        let Jay = new Mountain("Jay Peak", trails);
                        let trailLst = Jay.getTrailList();
                        let jayTrails = new Mountain("Jay Peak", trails);
                        let revLst = jayReviews.getListOfReviews();
                        let s = 1;
                        let ul = $("#reviewSection").find("ul");[0];
                        while (s < reviewList.length) {
                            let review = reviewList[s];
                            let reviewsTrail = review.getTrailName();
                            let reviewName = review.getReviewerName();
                            let reviewScore = review.getRating();

                            container = $('<li id="Review_item" class="container"></li>');
                            ul.append(container);
                            container.append('<dt class="item">'+ reviewsTrail + '</dt>');
                            container.append('<dt class="userName">' + "Name: " + reviewName + '</dt>');
                            container.append('<dt class="rating">' + "Rating: "  + reviewScore + '</dt>');

                            s++;
                        }
                    });
                });
            </script>
        </div>
        <div id="TrailSection">
                <ul>
                      
                </ul>
            <script>
                fetchTrails(trailsPath).then((trails) => {
                    fetchReviews(reviewsPath).then((reviews) => {
                        let jayReviews = new MountainReviews("Jay Peak", reviews);
                        let reviewList = jayReviews.getListOfReviews();
                        let Jay = new Mountain("Jay Peak", trails);
                        let trailLst = Jay.getTrailList();
                        let jayTrails = new Mountain("Jay Peak", trails);
                        let revLst = jayReviews.getListOfReviews();
                        let r = 1;
                        while(r < revLst.length - 1){
                            for(let i = 1; i < trailLst.length; i++){
                                if(trailLst[i].getName() == revLst[r].getTrailName()){
                                    let add = revLst[r].getRating();
                                    trailLst[i].addRating(add);                               
                                    
                                }
                            }
                            r++
                        }

                        let s = 1;
                        let ul = $("#reviewSection").find("ul");[0];
                        while (s < trailLst.length) {
                            let trail = trailLst[s];
                            let trailName = trail.getName();
                            let trailDifficulty = trail.getDifficulty();
                            let reviewScore = trail.getRating();

                            container = $('<li id="Review_item" class="container"></li>');
                            ul.append(container);
                            container.append('<dt class="item">'+ trailName + '</dt>');
                            container.append('<dt class="userName">' + "Name: " + trailDifficulty + '</dt>');
                            container.append('<dt class="rating">' + "Rating: "  + reviewScore + '</dt>');

                            s++;
                        }
                    });
                });
            </script>
        </div>
