    <script>
        //READ TRAIL DATA SCRIPT and create Mountain object
        let trails = [];
        function fetchTrails() {
    
            return fetch('ReadCsvData.php?action=trail&filename=jayPeakTrails.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to read response");
                }
                return response.json();
            })
            .then(data => {
                const trails = convertToTrails(data.message);
                return trails;
            })
            .catch(error => console.error('Error fetching trail data:', error));
        
        }
        
        

    </script>

    <div class="mainGrid">
        <div class="mapHighlight">
            <div id="map">
                <script>
                    const heightPix = 1164;
                    const widthPix = 1892;

                    const map = L.map('map', {
                        crs: L.CRS.Simple,
                        minZoom: -.5,
                        maxZoom: 4
                    }); 
                    const bounds = [[0, 0], [heightPix, widthPix]]; // [[0, 0], [height, width]]

                    const mOverlay = L.imageOverlay('TrailMaps/Screenshot 2025-11-25 211953.png', bounds, {
                        attribution: '&copy; <a href="https://jaypeakresort.com/">JayPeakResort</a>'
                    }).addTo(map);;   

                    map.fitBounds(bounds);
                    map.setMaxBounds(bounds);

                    let closed = false;

                    if (closed) {
                        L.rectangle(bounds, {color: "#FFFFFF", weight: 1}).addTo(map);
                        const marker = L.marker([bounds[1][0] / 2, bounds[1][1] / 2]).addTo(map);
                        marker.bindTooltip("Mountain Closed").openTooltip();
                    }

                    // const trailCoords = [
                    //     [120, 220],
                    //     [180, 300],
                    //     [260, 360],
                    //     [400, 480]
                    // ];

                    // L.polyline(trailCoords, {
                    //     color: "red",
                    //     weight: 4
                    // }).addTo(map);
                </script>
            </div>

        <div class="weather">

        <div class="trailStatus">

        <div class="reviewSection">
            <p>Leave a Review </p>
               <form method="POST" action="append.php">

            Name:<input type="text" name="fname">
            <br> </br>
            Score: <input id= "input" name = "score" type="range" min="0.0" max="5.0" step="0.1" value="1" id="scale">
            <p>Rating: <output id="value"></output></p>

            <script>
                const value = document.querySelector("#value");
                const input = document.querySelector("#input");
                value.textContent = input.value;
                input.addEventListener("input", (event) => {
                value.textContent = event.target.value;
                });
            </script>

            <label for="Mnt">Choose a mountain:</label>
            <select name="mnt" id="Mnt">
            <option value=JayPeak > Jay Peak</option>
            </select>
            <br></br>
            <label for="Trail">Choose the trail</label>
            <select name="Trail" id="Trail"></select>
            <script>
                fetchTrails().then((trails) => {
                let jay = new Mountain("Jay Peak", trails);
                let trailNames = jay.getAllTrailNames();
                const select = document.getElementById("Trail");
                trailNames.forEach(trail => {
                const option = document.createElement("option");
                option.textContent = trail; 
                select.appendChild(option);
            });

            
            
            });
            </script>



            <input type="button" value="Submit" onclick="this.form.submit()">
            </form>

        </div>
