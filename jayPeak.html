    <div class="mainGrid">
        <div class="mapHighlight">
            <div id="map">
                <script>
                    const heightPix = 1164;
                    const widthPix = 1892;

                    const map = L.map('map', {
                        crs: L.CRS.Simple,
                        minZoom: -.5,
                        maxZoom: 4
                    }); 
                    const bounds = [[0, 0], [heightPix, widthPix]]; // [[0, 0], [height, width]]

                    const mOverlay = L.imageOverlay('TrailMaps/Screenshot 2025-11-25 211953.png', bounds, {
                        attribution: '&copy; <a href="https://jaypeakresort.com/">JayPeakResort</a>'
                    }).addTo(map);;   

                    map.fitBounds(bounds);
                    map.setMaxBounds(bounds);

                    let closed = false;

                    if (closed) {
                        L.rectangle(bounds, {color: "#FFFFFF", weight: 1}).addTo(map);
                        const marker = L.marker([bounds[1][0] / 2, bounds[1][1] / 2]).addTo(map);
                        marker.bindTooltip("Mountain Closed").openTooltip();
                    }

                    // const trailCoords = [
                    //     [120, 220],
                    //     [180, 300],
                    //     [260, 360],
                    //     [400, 480]
                    // ];

                    // L.polyline(trailCoords, {
                    //     color: "red",
                    //     weight: 4
                    // }).addTo(map);
                </script>
            </div>
        </div>

        <div class="weather">
