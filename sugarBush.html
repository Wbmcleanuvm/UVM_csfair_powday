<!DOCTYPE html>
<html lang="en">
<link rel="shortcut icon" href="#">
<script src="Mountain.js"></script>
<script src="Review.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SugarBush</title>

    <link rel="stylesheet" href="powdayCSS.css">

    <style>
        h1 {
            text-align: center;
        }
    </style>
    <script>
    let trails = [];
        function fetchTrails() {
    
            return fetch('ReadCsvData.php?action=trail&filename=SugarBushtrails.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to read response");
                }
                return response.json();
            })
            .then(data => {
                const trails = convertToTrails(data.message);
                return trails;
            })
            .catch(error => console.error('Error fetching trail data:', error));
        
        }
    </script>
</head>
<body>
    <div class="navbackground">
        <div class="navbar">
            <a href="jayPeak.html">Jay Peak</a>
            <a href="boltonValley.html">Bolton Valley</a>
            <a href="sugarBush.html">SugarBush</a>
            <a href="smugglersNotch.html">SmugglersNotch</a>
            <a href="reviewForm.html">Review</a>
            <a href="index.html">Home</a>
        </div>
    </div>  

    <h1>
        SugarBush
    </h1>


    <div class="reviewSection">
            <p>Leave a Review </p>
               <form method="POST" action="append.php">

            Name:<input 
            type="text" 
            name="fname" 
            required 
            minlength="2" 
            maxlength="10" 
            pattern="[A-Za-z]+" 
            placeholder="Enter username"
            >

            <br> </br>
            Score: <input id= "input" name = "score" type="range" min="0.0" max="5.0" step="0.1" value="1" id="scale">
            <p>Rating: <output id="value"></output></p>

            <script>
                const value = document.querySelector("#value");
                const input = document.querySelector("#input");
                value.textContent = input.value;
                input.addEventListener("input", (event) => {
                value.textContent = event.target.value;
                });
            </script>

            <label for="Mnt">Choose a mountain:</label>
            <select name="mnt" id="Mnt">
                <option value= SugarBush>SugarBush</option>
            </select>

            <br></br>
            <label for="Trail">Choose the trail</label>
            <select name="Trail" id="Trail"></select>
            <script>
                fetchTrails().then((trails) => {
                let bush = new Mountain("SugarBush", trails);
                let trailNames = bush.getAllTrailNames();
                const select = document.getElementById("Trail");
                trailNames.forEach(trail => {
                const option = document.createElement("option");
                option.textContent = trail; 
                select.appendChild(option);
            });

            });
            </script>
            <input type="button" value="Submit" onclick="this.form.submit()">
            </form>

        </div>
</body>
</html>
